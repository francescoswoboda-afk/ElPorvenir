<!doctype html>
<html lang="en" class="home-page-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.home.title">El Porvenir Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="site-nav.js"></script>
  <link rel="preload" as="image" href="ElPorvenir-Homepage.jpg" fetchpriority="high" />
  <link rel="prefetch" as="image" href="ElPorvenir-AboutUs.jpg" />
  <link rel="prefetch" as="image" href="ElPorvenir-PecanNutHeader.jpg" />
  <link rel="prefetch" href="about-us.html" />
  <link rel="prefetch" href="our-farm.html" />
  <link rel="prefetch" href="pecan-nuts.html" />
  <link rel="prefetch" href="contact-us.html" />
</head>
<body class="home-page transitions-blocked">
  <div class="side-menu" data-side-menu>
    <div class="side-menu-zone" aria-hidden="true"></div>
    <button class="side-menu-handle" type="button" aria-expanded="false" aria-controls="side-menu-panel" aria-label="Open menu" data-i18n-aria-label="menu.open"></button>
    <nav class="side-menu-panel" id="side-menu-panel" aria-label="Main navigation">
      <a href="index.html" data-i18n="nav.home" aria-current="page">Home</a>
      <a href="about-us.html" data-i18n="nav.about">About us</a>
      <a href="our-farm.html" data-i18n="nav.farm">Our farm</a>
      <a href="pecan-nuts.html" data-i18n="nav.pecan">Pecan nuts</a>
      <a href="contact-us.html" data-i18n="nav.contact">Contact us</a>
    </nav>
  </div>

  <main class="homepage" role="main" aria-label="El Porvenir Farm homepage">
    <section class="hero" aria-label="Hero section">
      <header class="topbar">
        <a class="brand" href="#" aria-label="El Porvenir Farm home">
          <img class="brand-logo" src="ElPorvenir-Logo.png" alt="El Porvenir Farm" />
        </a>
        <div class="lang-switch" aria-label="Language selector">
          <a class="active" href="#" data-lang="en">EN</a>
          <span>|</span>
          <a href="#" data-lang="es">ES</a>
        </div>
      </header>

      <div class="hero-content page-transition-target reveal-on-scroll">
        <h1 data-i18n-html="home.hero.title"><span>Rooted in nature.</span><span>Growing the future.</span></h1>
        <span class="hero-divider" aria-hidden="true"></span>
        <p data-i18n-html="home.hero.body">
          El Porvenir is a family-owned, working pecan farm. With over 20 years of experience in agriculture,<br />
          since 2014 we have pursued our passion for dried fruits.
        </p>
      </div>
    </section>
  </main>

  <script src="translations.js"></script>
  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var revealElements = document.querySelectorAll('.reveal-on-scroll');
      if (!revealElements.length) {
        return;
      }

      if (reduceMotion || !('IntersectionObserver' in window)) {
        revealElements.forEach(function (element) {
          element.classList.add('is-visible');
        });
        return;
      }

      var observer = new IntersectionObserver(function (entries, io) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) {
            return;
          }
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        });
      }, {
        threshold: 0.18,
        rootMargin: '0px 0px -8% 0px'
      });

      revealElements.forEach(function (element) {
        observer.observe(element);
      });
    })();
  </script>
</body>
</html>
