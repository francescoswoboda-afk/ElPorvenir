<!doctype html>
<html lang="en" class="home-page-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Porvenir Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="prefetch" href="about-us.html" />
  <link rel="prefetch" href="our-farm.html" />
</head>
<body class="home-page transitions-blocked">
  <main class="homepage" role="main" aria-label="El Porvenir Farm homepage">
    <section class="hero" aria-label="Hero section">
      <header class="topbar">
        <a class="brand" href="#" aria-label="El Porvenir Farm home">
          <img class="brand-logo" src="ElPorvenir-Logo (2).png" alt="El Porvenir Farm" />
        </a>
        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-menu">
          <span class="menu-toggle-line" aria-hidden="true"></span>
          <span class="menu-toggle-line" aria-hidden="true"></span>
          <span class="menu-toggle-line" aria-hidden="true"></span>
        </button>
        <div class="nav-wrap" id="site-menu">
          <nav class="nav" aria-label="Main navigation">
            <a class="active" href="index.html">Home</a>
            <a href="about-us.html">About us</a>
            <a href="our-farm.html">Our farm</a>
            <a href="#">Pecan nuts</a>
            <a href="#">Contact us</a>
          </nav>
          <div class="lang-switch" aria-label="Language selector">
            <a class="active" href="#">EN</a>
            <span>|</span>
            <a href="#">ES</a>
          </div>
        </div>
      </header>

      <div class="hero-content page-transition-target reveal-on-scroll">
        <h1><span>Rooted in nature.</span><span>Growing the future.</span></h1>
        <span class="hero-divider" aria-hidden="true"></span>
        <p>
          El Porvenir is a family-owned, working pecan farm. With over 20 years of experience in agriculture,<br />
          since 2014 we have pursued our passion for dried fruits.
        </p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var supportsViewTransitions = typeof document.startViewTransition === 'function';

      try {
        if (!supportsViewTransitions && sessionStorage.getItem('ep-page-transition') === 'enter') {
          sessionStorage.removeItem('ep-page-transition');
          document.body.classList.add('page-enter');
          window.setTimeout(function () {
            document.body.classList.remove('page-enter');
          }, 340);
        }
      } catch (error) {
        // Ignore storage failures and continue normal behavior.
      }

      // Fallback navigation transition only when native View Transitions are unavailable.
      document.addEventListener('click', function (event) {
        if (supportsViewTransitions) {
          return;
        }

        var link = event.target.closest('a[href="about-us.html"], a[href="our-farm.html"], a[href="index.html"]');
        if (!link) {
          return;
        }

        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        var href = link.getAttribute('href');
        if (!href) {
          return;
        }

        event.preventDefault();
        try {
          sessionStorage.setItem('ep-page-transition', 'enter');
        } catch (error) {
          // Ignore storage failures and continue navigation.
        }
        window.location.assign(href);
      }, true);

      var topbar = document.querySelector('.topbar');
      var menuToggle = topbar ? topbar.querySelector('.menu-toggle') : null;
      var navWrap = topbar ? topbar.querySelector('.nav-wrap') : null;

      function closeMenu() {
        if (!topbar || !menuToggle) {
          return;
        }
        topbar.classList.remove('menu-open');
        document.body.classList.remove('mobile-nav-open');
        menuToggle.setAttribute('aria-expanded', 'false');
      }

      if (menuToggle && navWrap && topbar) {
        menuToggle.addEventListener('click', function () {
          var willOpen = !topbar.classList.contains('menu-open');
          topbar.classList.toggle('menu-open', willOpen);
          document.body.classList.toggle('mobile-nav-open', willOpen);
          menuToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        });

        navWrap.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', closeMenu);
        });

        navWrap.addEventListener('click', function (event) {
          if (event.target === navWrap) {
            closeMenu();
          }
        });

        document.addEventListener('click', function (event) {
          if (!topbar.classList.contains('menu-open')) {
            return;
          }
          if (topbar.contains(event.target)) {
            return;
          }
          closeMenu();
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') {
            closeMenu();
          }
        });

        window.addEventListener('resize', function () {
          if (window.innerWidth > 820) {
            closeMenu();
          }
        });
      }

      var revealElements = document.querySelectorAll('.reveal-on-scroll');
      if (!revealElements.length) {
        return;
      }

      if (reduceMotion || !('IntersectionObserver' in window)) {
        revealElements.forEach(function (element) {
          element.classList.add('is-visible');
        });
        return;
      }

      var observer = new IntersectionObserver(function (entries, io) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) {
            return;
          }
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        });
      }, {
        threshold: 0.18,
        rootMargin: '0px 0px -8% 0px'
      });

      revealElements.forEach(function (element) {
        observer.observe(element);
      });
    })();
  </script>
</body>
</html>
